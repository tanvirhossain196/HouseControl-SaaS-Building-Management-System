name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build needs no secrets: every screen behind sign-in is dynamic,
      # and the marketing pages prerender without a database.
      - name: Build
        run: npm run build

  database:
    name: Migrations and invariants
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Builds the schema from nothing, applies the seed, and runs every SQL
      # assertion. This is what catches a migration that only worked because
      # of what was already in somebody's local database.
      - name: Database suite
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database housecontrol_test'
          DATABASE_URL='postgres://postgres:postgres@localhost:5432/housecontrol_test' \
            ./scripts/db-test.sh
